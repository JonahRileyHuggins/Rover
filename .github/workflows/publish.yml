# Upload rover-sim to PyPI when a GitHub Release is published.
#
# One-time PyPI Trusted Publisher (no API token):
#   PyPI → Publishing → Add pending publisher
#     Owner:      JonahRileyHuggins
#     Repository: Rover
#     Workflow:   publish.yml
#     Environment: pypi
# Create the matching GitHub Environment named `pypi`
# (Settings → Environments). Then: bump version in pyproject.toml,
# push, and create a Release tagged v<version> (e.g. v0.1.0).

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    name: Test before publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: pytest tests -v --tb=short

  build:
    name: Build sdist and wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check version matches release tag
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          TAG="${TAG#v}"
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "pyproject version=$VERSION  release tag=$TAG"
          test "$VERSION" = "$TAG"

      - name: Install build tools
        run: python -m pip install -U build twine

      - name: Build
        run: python -m build

      - name: Check metadata
        run: twine check dist/*

      - name: Smoke-install the wheel
        run: |
          python -m pip install dist/*.whl
          python -c "from rover import HybridSimulator, run_hybrid; print('import ok')"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rover-sim
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
