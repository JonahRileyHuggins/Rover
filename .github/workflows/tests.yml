name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}${{ matrix.suite == 'full' && ' (full)' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.13"]
        suite: [fast]
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            suite: full
          - os: windows-latest
            python-version: "3.12"
            suite: fast
          - os: macos-latest
            python-version: "3.12"
            suite: fast

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Enable MSVC (StochMod model codegen)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Show C compiler
        shell: bash
        run: |
          if command -v gcc >/dev/null 2>&1; then gcc --version | head -1; fi
          if command -v clang >/dev/null 2>&1; then clang --version | head -1; fi
          if command -v cl >/dev/null 2>&1; then cl 2>&1 | head -3; fi

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        shell: bash
        run: |
          if [ "${{ matrix.suite }}" = "fast" ]; then
            pytest tests -v --tb=short \
              --ignore=tests/test_sparced_hybrid.py \
              --ignore=tests/test_stochastic_expression.py
          else
            pytest tests -v --tb=short
          fi

  package:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install -U build twine

      - name: Build
        run: python -m build

      - name: Check metadata
        run: twine check dist/*

      - name: Verify wheel ships rover, not tests
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          wheels = glob.glob("dist/*.whl")
          sdists = glob.glob("dist/*.tar.gz")
          assert wheels, "no wheel"
          assert sdists, "no sdist"
          names = zipfile.ZipFile(wheels[0]).namelist()
          if not any(n.startswith("rover/") for n in names):
              sys.exit("wheel is missing the rover package")
          if any(n.startswith("tests/") for n in names):
              sys.exit("wheel must not include tests/")
          print("wheel ok:", wheels[0])
          for n in sorted(names):
              print(" ", n)
          PY
