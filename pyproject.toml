[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rover"
version = "0.1.0"
description = "Hybrid BNGsim + StochMod simulation engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "bngsim>=0.9.0",
    "stochmod>=0.1.0",
    "python-libsbml>=5.20",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["rover*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
